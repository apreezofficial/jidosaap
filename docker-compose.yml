services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jidosapp_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - jidosapp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jidosapp_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=jidosapp
      - DB_USERNAME=postgres
      - DB_PASSWORD=jidosapp_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=jidosapp_jwt_secret_change_in_production_key_32chars!
      - ENCRYPTION_KEY=jidosapp_32_bytes_super_secret_encryption_key!
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN:-jidosapp_meta_verify_token}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-jidosapp-uploads}
    depends_on:
      - postgres
      - redis
    networks:
      - jidosapp-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jidosapp_worker
    restart: unless-stopped
    command: ["php", "worker.php"]
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=jidosapp
      - DB_USERNAME=postgres
      - DB_PASSWORD=jidosapp_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=jidosapp_jwt_secret_change_in_production_key_32chars!
      - ENCRYPTION_KEY=jidosapp_32_bytes_super_secret_encryption_key!
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - WORKER_SLEEP=3
      - WORKER_MAX_TRIES=3
    depends_on:
      - backend
      - postgres
      - redis
    networks:
      - jidosapp-network

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jidosapp_scheduler
    restart: unless-stopped
    # Run scheduler every minute via shell loop
    command: ["/bin/sh", "-c", "while true; do php scheduler.php; sleep 60; done"]
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=jidosapp
      - DB_USERNAME=postgres
      - DB_PASSWORD=jidosapp_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - backend
      - postgres
      - redis
    networks:
      - jidosapp-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: jidosapp_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jidosapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jidosapp_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jidosapp-network

  redis:
    image: redis:7-alpine
    container_name: jidosapp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jidosapp-network

volumes:
  postgres_data:
  redis_data:

networks:
  jidosapp-network:
    driver: bridge
